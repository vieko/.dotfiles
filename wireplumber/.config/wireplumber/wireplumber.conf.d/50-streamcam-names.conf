# Two Logitech StreamCams on CHAOS both expose a mic named "StreamCam Analog
# Stereo". Apps that remember the input by name (Discord) grab the wrong one,
# or a stale one, when switching cameras. Give each a distinct name, keyed on
# the USB serial, and prefer the face cam's mic as the default source.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_input.usb-046d_Logitech_StreamCam_16A01565-02.analog-stereo" }
    ]
    actions = {
      update-props = {
        node.description = "Face Cam Mic"
        node.nick        = "Face Cam Mic"
        priority.session = 2100
        priority.driver  = 2100
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_input.usb-046d_Logitech_StreamCam_4A3AEB25-02.analog-stereo" }
    ]
    actions = {
      update-props = {
        node.description = "Desk Cam Mic"
        node.nick        = "Desk Cam Mic"
      }
    }
  }
]
