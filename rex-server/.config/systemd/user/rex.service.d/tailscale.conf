# Join the personal Rex server to the tailnet as its own device,
# <hostname>-rex (chaos -> chaos-rex.<tailnet>.ts.net). Linux only:
# `rex server install` takes no server flags there, so they go here.
# Setup and sign-in: docs/rex-assessment.md, "Linux hosts".
[Service]
ExecStart=
ExecStart=/usr/bin/rex server run --log-format text --tailscale --tailscale-hostname %H-rex
